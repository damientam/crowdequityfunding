name: Daily EDGAR collection

on:
  schedule:
    - cron: '15 7 * * *' # 07:15 UTC, after EDGAR's overnight indexing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd collector && node --test test/*.test.js
      - run: node collector/collect.js
      - id: commit
        run: |
          if git status --porcelain data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "chore: daily EDGAR data update $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN does not trigger the on:push deploy
  # workflow, so chain it explicitly when the data changed.
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
