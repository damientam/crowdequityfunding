<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crowdfunding Watch</title>
  <meta name="description" content="Daily activity of a US equity-crowdfunding platform from its SEC EDGAR filings.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='8' width='3' height='7' rx='1' fill='%232a78d6'/%3E%3Crect x='6' y='4' width='3' height='11' rx='1' fill='%23eb6834'/%3E%3Crect x='11' y='1' width='3' height='14' rx='1' fill='%231baf7a'/%3E%3C/svg%3E">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="breadcrumb"><a href="index.html" data-i18n="backHome"></a></p>
      <h1 id="platform-title"><span class="platform-dot" id="platform-dot"></span><span id="platform-name"></span></h1>
      <p class="subtitle" id="platform-sub"></p>
    </div>
    <div class="header-right">
      <nav class="lang-toggle" aria-label="Language / Langue">
        <button class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
        <button class="lang-btn" data-lang="fr" aria-pressed="false">FR</button>
      </nav>
      <p class="updated" id="updated-at" aria-live="polite"></p>
    </div>
  </header>

  <main>
    <nav class="filter-row" aria-label="Filters">
      <span class="filter-label" data-i18n="period"></span>
      <button class="range-btn" data-days="30" data-i18n="range30"></button>
      <button class="range-btn" data-days="90" data-i18n="range90"></button>
      <button class="range-btn" data-days="180" data-i18n="range180"></button>
      <button class="range-btn" data-days="0" data-i18n="rangeAll"></button>
    </nav>

    <section class="kpi-row" id="kpi-row"></section>

    <section class="card" id="volume">
      <h2 data-i18n="volumeTitle"></h2>
      <p class="card-note" id="volume-note"></p>
      <div class="legend" id="volume-legend" role="list"></div>
      <div class="chart-wrap"><svg id="volume-chart" role="img"></svg></div>
    </section>

    <section class="card" id="amounts">
      <h2 data-i18n="amountsTitle"></h2>
      <p class="card-note" data-i18n="amountsNote"></p>
      <div class="chart-wrap"><svg id="amounts-chart" role="img"></svg></div>
    </section>

    <div class="two-col">
      <section class="card" id="progress">
        <h2 data-i18n="progressTitle"></h2>
        <p class="card-note" data-i18n="progressNote"></p>
        <ol class="progress-feed" id="progress-feed"></ol>
      </section>

      <section class="card" id="withdrawals">
        <h2 data-i18n="withdrawTitle"></h2>
        <p class="card-note" data-i18n="withdrawNote"></p>
        <ol class="progress-feed" id="withdrawal-feed"></ol>
      </section>
    </div>

    <section class="card" id="projects">
      <h2 data-i18n="tableTitle"></h2>
      <p class="card-note" data-i18n="tableNote"></p>
      <div class="table-wrap">
        <table id="filings-table">
          <thead>
            <tr>
              <th scope="col" data-i18n="thDate"></th>
              <th scope="col" data-i18n="thIssuer"></th>
              <th scope="col" data-i18n="thForm"></th>
              <th scope="col" class="num" data-i18n="thTarget"></th>
              <th scope="col" class="num" data-i18n="thMax"></th>
              <th scope="col" data-i18n="thDeadline"></th>
              <th scope="col" data-i18n="thSecurity"></th>
              <th scope="col">EDGAR</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <p class="error" id="load-error" hidden data-i18n="loadError"></p>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
  </footer>

  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="common.js"></script>
  <script src="platform.js"></script>
</body>
</html>
